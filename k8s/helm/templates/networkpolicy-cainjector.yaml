# TODO Check if selectors are rendered well because different naming applies between the actual chart name function and the outer dependee chart
#
# This chart differs from the original by removing the egress part which is a stronger requirement than the general ingress netpol discussion
{{- if .Values.certmanager.cainjector.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "cainjector.fullname" . }}-allow-ingress
  namespace: {{ include "cert-manager.namespace" . }}
spec:
  ingress:
    {{- with .Values.certmanager.cainjector.networkPolicy.ingress }}
      {{- toYaml . | nindent 2 }}
    {{- end }}
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cainjector.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: "cainjector"
  policyTypes:
  - Ingress
{{- end }}
