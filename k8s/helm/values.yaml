    #tolerations:
    #  - key: node-restriction.kubernetes.io/reserved-for
    #    operator: Equal
    #    value: platform

    # High Availability: ensure at least one working pod with more fail-over pods
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  startupapicheck:
    automountServiceAccountToken: false
    serviceAccount:
      automountServiceAccountToken: false
    volumes:
      - name: serviceaccount-token
        projected:
          defaultMode: 0444
          sources:
            - serviceAccountToken:
                expirationSeconds: 3607
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      apiVersion: v1
                      fieldPath: metadata.namespace
    volumeMounts:
      - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        name: serviceaccount-token
        readOnly: true
    resources:
      requests:
        cpu: 15m
        memory: 105M
      limits:
        memory: 105M

